name: Main Executable (SCES_006.50) - Rage Racer (PAL)
sha1: 2913e15648eddef40821c5f666460abc04155ee6
options:
  basename: main
  target_path: assets/PAL/main.exe
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/PAL/main
  src_path: src/main
  build_path: build/PAL
  ld_script_path: linkers/PAL/main.ld

  migrate_rodata_to_functions: False
  find_file_boundaries: True
  use_legacy_include_asm: True

  # Hand-written assembly lives beside the C it belongs with, under src/, not
  # in the generated asm/ tree that every split wipes.
  hasm_in_src_path: True

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  symbol_addrs_path:
    - configs/PAL/sym.main.txt
    - configs/PAL/sym.bss.main.txt
  reloc_addrs_path:
    - configs/PAL/rel.main.txt

  undefined_funcs_auto_path: linkers/PAL/undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/PAL/undefined_syms_auto.main.txt

  subalign: 4
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  ld_bss_is_noload: True

