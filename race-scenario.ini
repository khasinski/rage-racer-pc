[race]
# grand-prix or time-attack
mode = grand-prix

# grand-prix or extra-gp (time-attack always uses grand-prix)
series = grand-prix

# Numeric retail indices: class 0..5, course 0..3, car 0..12.
class = 0
course = 0
car = 3

# Preserve the selected car's setup, or explicitly request automatic/manual.
# Cars retain their original transmission availability restrictions.
transmission = default

# menu stops scenario automation after the finish, repeat starts the configured
# race again, and exit closes the port after the result flow.
after_finish = menu

# Default preserves the retail rival lineup. Alternatively provide exactly
# 11 car IDs in start-position order; -1 leaves a position empty.
grid = default

[boot]
# true loads the selected Grand Prix race without visiting selection menus.
# Time attack always uses the menus.
direct = true
# Skip the opening FMV and Grand Prix prologue while automating a scenario.
skip_sequences = true

[start]
# Optional exact track-point indices applied after the race and starting grid
# are initialized. Leave these commented for the retail starting positions.
# player_track_point = 120
# Use "-" to preserve a rival's retail position. Up to 11 entries are accepted;
# only rivals active in the selected race are relocated.
# rival_track_points = 118,116,114,112,110,108,106,104,102,100,98
# Exact placement captured by an M-key diagnostic mark. player_x and player_z
# must both be present; heading and camera are optional.
# player_x = 39373
# player_z = 32455
# player_heading = 0
# camera = 0
# Reapply a configured placement every frame. Leave false for a playable race.
freeze = false
