# Repeatable player/rival geometry inspection. Track point indices run
# opposite to race progress here, so smaller rival indices are ahead.
[race]
mode = grand-prix
class = 1
course = 0
car = 0
grid = 2,2,2,2,2,2,2,2,2,2,2
after_finish = menu
[boot]
direct = true
skip_sequences = true
[start]
player_track_point = 120
rival_track_points = 118,116,114,112,110,108,106,104,102,100,98
camera = 1
freeze = true
[video]
renderer = modern
[modern]
assets = disc
[stop]
scene = 12
timer = 350
[diagnostics]
performance = true
