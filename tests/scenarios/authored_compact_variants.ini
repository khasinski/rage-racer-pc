# Compact-body model coverage from the normal starting grid.  Variant tests
# only need the models to be loaded; moving the field after EnterRaceScene has
# already seeded the Grand Prix intro makes the visible camera test invalid.
[race]
mode = grand-prix
class = 2
course = 0
car = 3
grid = 4,5,6,7,8,9,10,4,6,8,0
after_finish = menu
[boot]
skip_sequences = true
[video]
renderer = modern
[modern]
assets = disc
[stop]
scene = 12
timer = 120
[diagnostics]
performance = true
