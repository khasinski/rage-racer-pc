# Gnade Esperanza: inspect its shadow and lamps, rather than Vainqure's body.
# Class 5 supplies sunset lighting. Use race.class=0 for daytime shadows;
# start.player_track_point=176 places the car near the tunnel exit.
[race]
mode = grand-prix
class = 5
course = 0
car = 3
variant = 0
grid = 2,0,1,3,2,0,1,3,2,0,1
after_finish = menu
[boot]
direct = true
skip_sequences = true
[start]
player_track_point = 120
rival_track_points = 118,116,114,112,110,108,106,104,102,100,98
camera = 1
freeze = true
[input]
raw_script = 1200-1800:SQUARE
[video]
renderer = modern
[modern]
assets = disc
ray_tracing = off
[stop]
scene = 12
timer = 652
