[video]
# 3D renderer: classic | modern. Classic preserves the PS1-compatible output;
# modern uses native geometry, a depth buffer and the settings below.
renderer = modern
# Runtime renderer toggle: any SDL key name, for example F10 or F9.
toggle_renderer_key = F10
# Modern internal resolution multiplier: 0.5..16. Native resolution is 320x240.
internal_scale = 4
# Modern 3D aspect ratio: auto | 4:3 | 16:9. Menus retain their original layout.
aspect = 16:9
# Presentation rate: logic | vsync | 1..1000. "logic" disables interpolation;
# "vsync" follows the monitor refresh rate.
fps = vsync
# Course visibility multiplier: 0..16. Above 1 the
# renderer revives faces the game itself never draws, and some of them come out
# as a black plane across the view, so this ships at the original distance.
draw_distance = 1
# Texture sampling: nearest | linear. Nearest preserves hard texel edges;
# linear smooths the modern 3D renderer and final 2D presentation.
texture_filter = linear
# Post-processing: none | fxaa.
post = fxaa
# Colour grading: off | vibrant.
grading = vibrant

[hud]
# HUD horizontal anchor in modern 16:9: center | edges. Edge anchoring uses
# the extra widescreen area; classic and modern 4:3 always retain retail positions.
anchor = edges
# Optional race HUD groups: true | false.
show_lap_times = true
show_time_limit = true

[camera]
# Third-person chase-camera turn lookahead: 0..1. Zero is the retail camera;
# one pans by up to roughly 30 degrees at full steering lock.
chase_turn_lookahead = 0.5

[modern]
# Native assets are discovered in a native-assets directory beside the
# executable. Set this only when keeping the imported cache elsewhere.
# assets = /path/to/native-assets

[timing]
# Base game/VBlank standard: pal | ntsc. PAL runs menus at 50 Hz and races at 25 Hz;
# NTSC runs them at 60/30 Hz. This is independent of interpolated video.fps.
standard = pal

[diagnostics]
# Log path, or auto to use the platform application-state directory.
log = auto
# Keep the previous 16 modern frames for M-key artifact triage: true | false.
# This costs
# substantial RAM/VRAM and copies a full scene snapshot every presented frame.
marker_history = false
# Log average modern-renderer CPU build/submission costs every 120 frames:
# true | false.
performance = false

[disc]
# Optional path to a PAL .cue sheet or .chd image. The launcher remembers a
# selected path in the platform user-config directory when this is left empty.
# image = /path/to/Rage Racer (Europe).chd
# The older `cue` key and RAGE_PORT_DISC_CUE environment variable still work.

[content]
# Car-model names: international | japanese. The Japanese set uses Alouette,
# Instinct, Victoire, Tempest and Dragone in the same model slots.
car_names = international
# Grand Prix prologue text: international | japanese. The Japanese text is
# longer. Its English narration is part of Track 02 on an NTSC-J disc and is
# therefore heard only when that legally obtained disc image is selected.
prologue = international

[start]
# Optional deterministic placement for race/debug scenarios.
# player_track_point = 120
# rival_track_points = 118,116,114,-
# Reapply configured positions every frame for rendering diagnostics.
# freeze = false

[input]
# Keyboard bindings, one per PlayStation button, using SDL key names.
up = Up
right = Right
down = Down
left = Left
cross = X
circle = D
square = Z
triangle = S
l1 = Q
r1 = R
l2 = W
r2 = E
select = Backspace
start = Return
l3 = 1
r3 = 2
# Analog gamepad mode: true | false. When enabled, a connected gamepad steers
# and meters the throttle through its stick and triggers. Disable it to retain
# the digital mapping.
analog = true
# Raw racing wheels which SDL does not classify as gamepads: true | false.
wheel = true
# SDL joystick axis indexes. These defaults match common Logitech layouts;
# change them for devices that expose a different order.
wheel_steering_axis = 0
wheel_steering_inverted = false
wheel_throttle_axis = 2
wheel_brake_axis = 3
wheel_pedals_inverted = true
# SDL joystick button indexes; use -1 to leave a button unmapped.
wheel_cross_button = 0
wheel_square_button = 1
wheel_circle_button = 2
wheel_triangle_button = 3
wheel_l1_button = 4
wheel_r1_button = 5
wheel_start_button = 9

# Analog response, per axis, matching the NeGcon settings DuckStation exposes so
# values can be copied between them. Axes are steering, throttle and brake,
# which are the twist and the I and II buttons a real NeGcon has.
# Deadzone 0..0.99, saturation 0.01..1, linearity -2..2, scaling 0.01..10.
# Linearity is an exponent rather than a fraction: 0 is a straight line, above
# it softens the middle of the throw and below it sharpens it.
# steering_deadzone = 0
# steering_saturation = 1
# steering_linearity = 0
# steering_scaling = 1
