[video]
# classic or modern; F10 switches between them while the game is running.
renderer = classic
toggle_renderer_key = F10
internal_scale = 2
aspect = auto
fps = logic
draw_distance = 1
texture_filter = nearest
post = none
bloom = off
grading = off

[diagnostics]
# The platform state directory is used when this remains auto.
log = auto

[disc]
# Optional path to the PAL .cue sheet. The launcher remembers a selected path
# in the platform user-config directory when this is left empty.
# cue = /path/to/Rage Racer (Europe).cue

[start]
# Optional deterministic placement for race/debug scenarios.
# player_track_point = 120
# rival_track_points = 118,116,114,-
# Reapply configured positions every frame for rendering diagnostics.
# freeze = false
