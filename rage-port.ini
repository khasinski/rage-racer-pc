[video]
# Enhanced 3D renderer. Use "classic" for the original PS1-compatible output.
renderer = modern
# Runtime renderer toggle; useful for direct classic/modern comparisons.
toggle_renderer_key = F10
# Render the modern 3D scene at four times the native 320x240 resolution.
internal_scale = 4
# Widen the modern 3D camera while 2D menus retain their original layout.
aspect = 16:9
# Present interpolated frames at the monitor refresh rate.
fps = vsync
# Extend visible course geometry beyond the original distance. Above 1 the
# renderer revives faces the game itself never draws, and some of them come out
# as a black plane across the view, so this ships at the original distance.
draw_distance = 1
# Smooth texture sampling in the modern renderer and final 2D presentation.
texture_filter = linear
# Apply fast approximate anti-aliasing to the completed modern frame.
post = fxaa
# Add a glow pass around bright pixels.
bloom = on
# Use the more saturated modern colour-grading preset.
grading = vibrant

[timing]
# Base game/VBlank standard. PAL runs menus at 50 Hz and races at 25 Hz;
# NTSC runs them at 60/30 Hz. This is independent of interpolated video.fps.
standard = pal

[diagnostics]
# The platform state directory is used when this remains auto.
log = auto
# Keep the previous 16 modern frames for M-key artifact triage. This costs
# substantial RAM/VRAM and copies a full scene snapshot every presented frame.
marker_history = false
# Log average modern-renderer CPU build/submission costs every 120 frames.
performance = false

[disc]
# Optional path to the PAL .cue sheet. The launcher remembers a selected path
# in the platform user-config directory when this is left empty.
# cue = /path/to/Rage Racer (Europe).cue

[start]
# Optional deterministic placement for race/debug scenarios.
# player_track_point = 120
# rival_track_points = 118,116,114,-
# Reapply configured positions every frame for rendering diagnostics.
# freeze = false

[input]
# Keyboard bindings, one per PlayStation button, using SDL key names.
up = Up
right = Right
down = Down
left = Left
cross = X
circle = D
square = Z
triangle = S
l1 = Q
r1 = R
l2 = W
r2 = E
select = Backspace
start = Return
l3 = 1
r3 = 2
# A connected gamepad steers and meters the throttle through its stick and
# triggers. Set this to false to keep it on the digital mapping.
analog = true

# Analog response, per axis, matching the NeGcon settings DuckStation exposes so
# values can be copied between them. Axes are steering, throttle and brake,
# which are the twist and the I and II buttons a real NeGcon has.
# Deadzone 0..0.99, saturation 0.01..1, linearity -2..2, scaling 0.01..10.
# Linearity is an exponent rather than a fraction: 0 is a straight line, above
# it softens the middle of the throw and below it sharpens it.
# steering_deadzone = 0
# steering_saturation = 1
# steering_linearity = 0
# steering_scaling = 1
