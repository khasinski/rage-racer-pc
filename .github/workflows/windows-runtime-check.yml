name: Windows runtime checks

# Deep Windows verification of the shipped executable. It does not publish
# anything. Every game launch is headless (PSYZ_HEADLESS=1) and silent
# (SDL_AUDIODRIVER=dummy). Retail disc data is never available here, so the
# retail-only runtime tests are not registered; renderer coverage uses the
# smoke executable and synthetic fixtures on Mesa's lavapipe Vulkan driver.

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Published release whose Windows executable is scanned as a Defender control
        required: false
        default: 0.6.14-alpha
  pull_request:
  push:
    branches: [main, "fix/**", "release/**"]

permissions:
  contents: read

env:
  PSYZ_HEADLESS: "1"
  SDL_AUDIODRIVER: dummy

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (release toolchain)
        run: >-
          cmake -S . -B build/release -G "Visual Studio 17 2022" -A x64
          -T ClangCL -DRAGE_EMBED_AUTHORED_CARS=OFF

      - name: Build
        run: cmake --build build/release --config Release --parallel

      - name: Unit and functional tests
        run: >-
          ctest --test-dir build/release -C Release --output-on-failure
          -L '^(unit|functional|tooling)$' --parallel 4

      - name: HD download over WinHTTP against a local origin
        run: >-
          ctest --test-dir build/release -C Release --output-on-failure
          -R '^hd_download$'

      - name: Stage release layout
        shell: pwsh
        run: |
          $root = "dist/Rage-Racer-ci-windows-x86_64"
          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item build/release/Release/rage-racer.exe "$root/Rage-Racer.exe"
          Copy-Item README.md, LICENSE.md, rage-port.ini, race-scenario.ini, cars.toml, cars.ntscj.toml $root
          "RAGE_PACKAGE=$((Resolve-Path $root).Path)" >> $env:GITHUB_ENV

      - name: Executable imports and metadata
        shell: pwsh
        run: |
          $exe = Join-Path $env:RAGE_PACKAGE "Rage-Racer.exe"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $imports = (& $dumpbin /nologo /dependents $exe) |
            Where-Object { $_ -match '^\s+\S+\.(dll|DLL)\s*$' } | ForEach-Object { $_.Trim().ToLowerInvariant() }
          Write-Host "Imported DLLs:"; $imports | ForEach-Object { Write-Host "  $_" }
          # A raw socket/TLS/crypto client inside the game is what Defender's
          # ML model associated with downloader trojans in 0.6.14.
          $forbidden = @('ws2_32.dll','crypt32.dll','secur32.dll','iphlpapi.dll','bcrypt.dll','wininet.dll','urlmon.dll')
          $hits = $imports | Where-Object { $forbidden -contains $_ }
          if ($hits) { throw "Rage-Racer.exe must not import: $($hits -join ', ')" }
          if ($imports -notcontains 'winhttp.dll') { throw "HD downloads should use the system WinHTTP stack" }
          $system = "$env:SystemRoot\System32"
          foreach ($dll in $imports) {
            if (-not (Test-Path (Join-Path $system $dll)) -and -not (Test-Path (Join-Path $env:RAGE_PACKAGE $dll))) {
              throw "Import $dll is neither a Windows system DLL nor shipped in the archive"
            }
          }
          $info = (Get-Item $exe).VersionInfo
          $info | Format-List ProductName, FileDescription, CompanyName, ProductVersion, FileVersion, OriginalFilename, LegalCopyright
          if ($info.ProductName -ne 'Rage Racer PC' -or $info.OriginalFilename -ne 'Rage-Racer.exe' -or
              -not $info.CompanyName -or -not $info.ProductVersion) {
            throw "Rage-Racer.exe is missing Windows version metadata"
          }
          $headers = & $dumpbin /nologo /headers $exe
          foreach ($flag in 'Dynamic base','NX compatible','High Entropy Virtual Addresses') {
            if (-not ($headers -match $flag)) { throw "Missing PE mitigation: $flag" }
          }

      - name: Microsoft Defender scan (new build and baseline control)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: ${{ inputs.baseline || '0.6.14-alpha' }}
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { Write-Host "::warning::Microsoft Defender is not available on this runner"; exit 0 }
          & $mp -SignatureUpdate | Out-Host
          Get-MpComputerStatus -ErrorAction SilentlyContinue |
            Format-List AMProductVersion, AntivirusSignatureVersion, AntivirusSignatureLastUpdated | Out-Host
          function Scan($path) {
            $out = & $mp -Scan -ScanType 3 -File $path -DisableRemediation 2>&1
            $out | Out-Host
            return $LASTEXITCODE
          }
          $baselineDir = "baseline"
          gh release download $env:BASELINE -R $env:GITHUB_REPOSITORY -p "*windows-x86_64.zip" -D $baselineDir --skip-existing 2>$null
          Get-ChildItem $baselineDir -Filter "Rage-Racer-*-windows-x86_64.zip" -ErrorAction SilentlyContinue |
            ForEach-Object { Expand-Archive $_.FullName -DestinationPath $baselineDir -Force }
          $old = Get-ChildItem $baselineDir -Recurse -Filter Rage-Racer.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($old) {
            $code = Scan $old.FullName
            Write-Host "Baseline $env:BASELINE scan exit code: $code (2 = threat found)"
            if ($code -eq 2) { Write-Host "::notice::Baseline $env:BASELINE is detected by Defender on this runner" }
          }
          $code = Scan (Join-Path $env:RAGE_PACKAGE "Rage-Racer.exe")
          Write-Host "New build scan exit code: $code"
          if ($code -eq 2) { throw "Microsoft Defender flags the new Rage-Racer.exe" }

      - name: Prepare packaged launch probes
        shell: pwsh
        run: |
          # Run from a directory whose name has spaces and Polish characters
          # to cover the UTF-8 code-page manifest.
          $unicode = Join-Path $env:RUNNER_TEMP "Gra Żółć test"
          New-Item -ItemType Directory -Force $unicode | Out-Null
          Copy-Item "$env:RAGE_PACKAGE/*" $unicode -Recurse -Force
          "RAGE_UNICODE_DIR=$unicode" >> $env:GITHUB_ENV
          $helper = @'
          function Launch($label, $arguments, $expect, $reject) {
            $unicode = $env:RAGE_UNICODE_DIR
            $stdout = Join-Path $env:RUNNER_TEMP "$label.out.txt"
            $stderr = Join-Path $env:RUNNER_TEMP "$label.err.txt"
            # diagnostics.log takes a file path; the game redirects stderr there.
            $log = Join-Path $env:RUNNER_TEMP "$label diagnostyka ż.log"
            $arguments = @("--set", "diagnostics.log=`"$log`"") + $arguments
            $p = Start-Process -FilePath (Join-Path $unicode "Rage-Racer.exe") -ArgumentList $arguments `
              -WorkingDirectory $unicode -NoNewWindow -PassThru `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "$label hung for 60 s" }
            $text = (Get-Content $stdout -Raw) + (Get-Content $stderr -Raw)
            if (Test-Path -LiteralPath $log) { $text += (Get-Content -LiteralPath $log -Raw -Encoding UTF8) }
            Write-Host "--- $label exit $($p.ExitCode)"; Write-Host $text
            if ($p.ExitCode -lt 0 -or $p.ExitCode -gt 255) {
              throw ("{0} crashed with 0x{1:X8}" -f $label, $p.ExitCode)
            }
            if ($p.ExitCode -eq 0) { throw "$label unexpectedly succeeded without retail data" }
            if ($text -notmatch $expect) { throw "$label did not report: $expect" }
            if ($reject -and $text -match $reject) { throw "$label unexpectedly reported: $reject" }
          }
          '@
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "launch.ps1") -Value $helper -Encoding UTF8

      - name: Packaged first launch without Vulkan
        shell: pwsh
        run: |
          # Hosted runners have no GPU driver. Up to 0.6.14 the game kept
          # running without a window here; it must explain the requirement.
          . (Join-Path $env:RUNNER_TEMP "launch.ps1")
          Launch "no-vulkan" @() "graphics driver with Vulkan support" $null

      - name: Install Vulkan loader and Mesa lavapipe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tools = Join-Path $env:RUNNER_TEMP "vulkan"
          New-Item -ItemType Directory -Force $tools | Out-Null
          if (-not (Test-Path "$env:SystemRoot\System32\vulkan-1.dll")) {
            git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Loader.git "$tools/loader-src"
            cmake -S "$tools/loader-src" -B "$tools/loader-build" -A x64 -DUPDATE_DEPS=ON -DBUILD_TESTS=OFF
            cmake --build "$tools/loader-build" --config Release --parallel
            $loader = Get-ChildItem "$tools/loader-build" -Recurse -Filter vulkan-1.dll | Select-Object -First 1
            # Test-only: placed next to test executables, never in the package.
            Copy-Item $loader.FullName $env:RAGE_UNICODE_DIR -Force
            Get-ChildItem build/release -Recurse -Directory -Filter Release |
              ForEach-Object { Copy-Item $loader.FullName $_.FullName -Force }
          }
          $asset = gh release view -R pal1000/mesa-dist-win --json assets --jq '.assets[].name' |
            Where-Object { $_ -match '^mesa3d-.*-release-msvc\.7z$' } | Select-Object -First 1
          gh release download -R pal1000/mesa-dist-win -p $asset -D $tools
          7z x "$tools/$asset" "-o$tools/mesa" -y | Out-Null
          $icd = Get-ChildItem "$tools/mesa/x64" -Recurse -Filter "lvp_icd*.json" | Select-Object -First 1
          if (-not $icd) { throw "lavapipe ICD not found in $asset" }
          Get-Content $icd.FullName | Out-Host
          # The runner account is elevated, and the Vulkan loader ignores
          # VK_DRIVER_FILES in elevated processes. Register the ICD the way a
          # driver installer does on this ephemeral VM.
          $key = "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name $icd.FullName -PropertyType DWord -Value 0 -Force | Out-Null
          "VK_DRIVER_FILES=$($icd.FullName)" >> $env:GITHUB_ENV
          "VK_ICD_FILENAMES=$($icd.FullName)" >> $env:GITHUB_ENV
          Write-Host "Using $asset with $($icd.FullName)"

      - name: Packaged first launch without a disc (Vulkan available)
        shell: pwsh
        env:
          VK_LOADER_DEBUG: error,warn,driver
          SDL_LOGGING: "gpu=debug"
        run: |
          # The release executable must fail with an actionable message, not
          # crash or hang, when no disc image is available and dialogs are
          # suppressed.
          . (Join-Path $env:RUNNER_TEMP "launch.ps1")
          $vulkan = "graphics driver with Vulkan support"
          Launch "no-disc" @() "disc picker suppressed|No Rage Racer disc image" $vulkan
          # A non-disc file renamed .bin must be rejected by content, which
          # proves the UTF-8 path was opened rather than mis-encoded.
          $fake = Join-Path $env:RAGE_UNICODE_DIR "Zła płyta.bin"
          [IO.File]::WriteAllBytes($fake, (New-Object byte[] (2352 * 32)))
          Launch "invalid-bin" @("--set", "disc.cue=`"$fake`"") "valid PlayStation|ISO-9660" $vulkan
          Launch "missing-disc" @("--set", "disc.cue=`"$env:RAGE_UNICODE_DIR\brak.cue`"") "Cannot find or read" $vulkan

      - name: Modern renderer smoke on Vulkan (lavapipe)
        shell: pwsh
        run: |
          $bin = "build/release/Release"
          $log = Join-Path $env:RUNNER_TEMP "smoke.log"
          $p = Start-Process -FilePath "$bin/rage-racer-smoke.exe" -NoNewWindow -PassThru `
            -ArgumentList @("--set","video.renderer=modern","--set","boot.direct=false","--set","race.enabled=false",
                            "--set","run.frames=600") `
            -RedirectStandardOutput "$log.out" -RedirectStandardError "$log.err"
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "smoke run hung" }
          $text = (Get-Content "$log.out" -Raw) + (Get-Content "$log.err" -Raw)
          Write-Host $text
          if ($p.ExitCode -ne 0) { throw ("smoke run failed with exit code 0x{0:X}" -f $p.ExitCode) }
          if ($text -notmatch "(?i)driver vulkan") { throw "modern renderer did not start on Vulkan" }
          if ($text -match "Invalid GPU device") { throw "renderer ran without a GPU device" }

      - name: GPU and end-to-end tests on lavapipe
        shell: pwsh
        run: |
          ctest --test-dir build/release -C Release --output-on-failure -L '^(gpu|e2e)$' --timeout 600 --output-junit e2e-junit.xml
          if ($LASTEXITCODE -ne 0) { throw "Windows GPU/e2e tests failed" }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-diagnostics
          path: |
            ${{ runner.temp }}/*.txt
            ${{ runner.temp }}/*.log*
            build/release/e2e-junit.xml
            build/release/Testing/Temporary/LastTest.log
            build/release/reports/**
          if-no-files-found: ignore
