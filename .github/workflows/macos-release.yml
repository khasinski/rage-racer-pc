name: macOS arm64 release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version used in the archive name
        required: true
        default: 0.6.3-alpha
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/release --parallel
      - name: Verify portable tests
        run: >-
          ctest --test-dir build/release --output-on-failure
          -R '^(game_logic|rmesh|rmesh_index|asset_id|car_paint|texture_mipmap|mod_manifest|render_material|rmesh_cache|render_world|render_world_snapshot|track_asset_identity|track_lighting|render_mesh_build|release_package|timing_restore|axis_curve)$'
      - name: Stage bundle resources
        run: |
          resources="build/release/Rage Racer.app/Contents/Resources"
          mkdir -p "$resources" dist
          cp README.md LICENSE.md rage-port.ini race-scenario.ini "$resources/"
      - name: Sign and notarize
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          app="build/release/Rage Racer.app"
          # The linker ad-hoc signs the executable, and that signature expects a
          # sealed resource directory. Staging files into Contents/Resources
          # without re-signing leaves the bundle inconsistent, which Gatekeeper
          # reports as a damaged download. Either branch below re-signs.
          if [ -z "${CERT_P12:-}" ]; then
            echo "No Developer ID configured; signing ad-hoc (not notarized)."
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -f pkcs12
          # Without this codesign would block on an interactive keychain prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk 'NR==1 {print $2}')"
          # Notarization requires the hardened runtime and a secure timestamp.
          codesign --force --deep --options runtime --timestamp \
            --sign "$identity" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --team-id "$TEAM_ID" --wait
          # Staple the ticket into the bundle so it validates without a network
          # round trip; the archive built below then carries it.
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"
      - name: Archive
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          package="Rage-Racer-${VERSION}-macos-arm64"
          # The copies inside the bundle are sealed by the signature and cannot
          # be edited without breaking it, so lay the editable ones beside the
          # app, the way the Linux archive does.
          mkdir -p "dist/${package}"
          ditto "build/release/Rage Racer.app" "dist/${package}/Rage Racer.app"
          cp README.md LICENSE.md rage-port.ini race-scenario.ini \
            "dist/${package}/"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/${package}" "dist/${package}.zip"
          unzip -l "dist/${package}.zip" | grep -q "${package}/rage-port.ini$"
          unzip -l "dist/${package}.zip" | grep -q "Contents/Resources/rage-port.ini$"
          if unzip -l "dist/${package}.zip" | grep -E '\.py$'; then
            echo "Python file found in release archive" >&2
            exit 1
          fi
          # The archived copy must still validate, ditto included.
          rm -rf "$RUNNER_TEMP/verify" && mkdir -p "$RUNNER_TEMP/verify"
          ditto -x -k "dist/${package}.zip" "$RUNNER_TEMP/verify"
          codesign --verify --deep --strict \
            "$RUNNER_TEMP/verify/${package}/Rage Racer.app"
          shasum -a 256 "dist/${package}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Rage-Racer-${{ inputs.version || github.ref_name }}-macos-arm64
          path: dist/*.zip
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release upload "$VERSION" dist/*.zip --clobber
