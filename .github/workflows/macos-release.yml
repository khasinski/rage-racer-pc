name: macOS arm64 release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version used in the archive name
        required: true
        default: 0.4-alpha
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install runtime dependencies
        run: brew install ffmpeg
      - name: Configure
        run: cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/release --parallel
      - name: Verify portable tests
        run: ctest --test-dir build/release --output-on-failure -R '^(game_logic|release_package|native_ui_script_layout|native_frame_offsets|frame_environment_aliases|audio_state_layout)$'
      - name: Package
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          package="Rage-Racer-${VERSION}-macos-arm64"
          resources="build/release/Rage Racer.app/Contents/Resources"
          mkdir -p "$resources" dist
          cp README.md LICENSE.md rage-port.ini rage-input.cfg race-scenario.ini "$resources/"
          ditto -c -k --sequesterRsrc --keepParent \
            "build/release/Rage Racer.app" "dist/${package}.zip"
          unzip -l "dist/${package}.zip" | grep -q "Contents/Resources/rage-port.ini$"
          shasum -a 256 "dist/${package}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Rage-Racer-${{ inputs.version || github.ref_name }}-macos-arm64
          path: dist/*.zip
          if-no-files-found: error
