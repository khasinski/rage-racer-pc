name: Build

# decomp.dev only reads workflow runs on the default branch triggered by a
# push, and only artifacts named <version>_report. Everything else here exists
# so that a report is never published from a build that did not match.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  build:
    # The game executable is not in this repository, so a fork has nothing to
    # build with. Failing every fork's first push is not a useful greeting.
    if: github.repository == 'khasinski/rage-racer-decomp'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [PAL]
    # The build reaches for an unprefixed cpp/as/ld through the environment as
    # well as through make, so both have to be pointed at the cross tools.
    env:
      AS: mipsel-linux-gnu-as
      LD: mipsel-linux-gnu-ld
      NM: mipsel-linux-gnu-nm
      OBJCOPY: mipsel-linux-gnu-objcopy
      READELF: mipsel-linux-gnu-readelf
      CPP: mipsel-linux-gnu-cpp
      MAKEFLAGS: >-
        AS=mipsel-linux-gnu-as LD=mipsel-linux-gnu-ld
        NM=mipsel-linux-gnu-nm OBJCOPY=mipsel-linux-gnu-objcopy
        READELF=mipsel-linux-gnu-readelf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The 2.6.3 cc1 is a 32-bit x86 binary, so it runs natively on the
      # runner. On an arm64 host tools/scripts/cc.sh falls back to Docker.
      - name: Install cross tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-mipsel-linux-gnu libc6:i386

      - name: Fetch the game executable and compiler
        # A private repository holds the retail EXE and the gcc 2.6.3 cc1;
        # neither can be published here. Reached through a read-only deploy key
        # rather than a token: it is scoped to that one repository and does not
        # expire, so this does not quietly stop building in a year's time.
        uses: actions/checkout@v4
        with:
          repository: khasinski/rage-racer-assets
          ssh-key: ${{ secrets.ASSETS_SSH_KEY }}
          path: .assets

      - name: Place them where the build expects
        run: |
          mkdir -p assets/${{ matrix.version }} build/toolchain/bin
          cp .assets/${{ matrix.version }}/main.exe assets/${{ matrix.version }}/
          cp .assets/${{ matrix.version }}/SYSTEM.CNF assets/${{ matrix.version }}/
          cp .assets/toolchain/cc1-psx-263 build/toolchain/bin/
          chmod +x build/toolchain/bin/cc1-psx-263
          rm -rf .assets

      - name: Install Python tooling
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      # Splitting before building is not optional. A stale asm/ tree left over
      # from an earlier revision has repeatedly produced a link that succeeds
      # against symbols the current sources no longer define.
      - name: Split
        run: make split VERSION=${{ matrix.version }}

      - name: Build and verify against the retail SHA-1
        run: make build check VERSION=${{ matrix.version }}

      - name: Check the scaffolding ratchet and the tool tests
        run: |
          make audit-code
          make test

      - name: Install objdiff
        run: |
          curl -sSfL -o build/toolchain/bin/objdiff-cli \
            https://github.com/encounter/objdiff/releases/download/v3.8.0/objdiff-cli-linux-x86_64
          chmod +x build/toolchain/bin/objdiff-cli

      - name: Generate the progress report
        run: make report VERSION=${{ matrix.version }}

      # The artifact name is the contract with decomp.dev: it takes the text
      # before _report as the version shown on the site.
      - name: Publish the progress report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: SCES_006.50_report
          path: build/${{ matrix.version }}/report.json
