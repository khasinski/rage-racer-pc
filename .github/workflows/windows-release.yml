name: Windows x86-64 release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version used in the archive name
        required: true
        default: 0.6-alpha
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build/release -G "Visual Studio 17 2022" -A x64 -T ClangCL -DBUILD_TESTING=OFF
      - name: Build
        run: cmake --build build/release --config Release --target rage-racer --parallel
      - name: Verify portable tests
        run: python tests/verify_release_package.py .
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $package = "Rage-Racer-$env:VERSION-windows-x86_64"
          $root = "dist/$package"
          New-Item -ItemType Directory -Force $root | Out-Null
          New-Item -ItemType Directory -Force "$root/tools" | Out-Null
          Copy-Item build/release/Release/rage-racer.exe "$root/Rage-Racer.exe"
          Copy-Item README.md, LICENSE.md, rage-port.ini, race-scenario.ini $root
          Copy-Item tools/rage-launcher.py "$root/tools/rage-launcher.py"
          Compress-Archive -Path $root -DestinationPath "dist/$package.zip" -Force
          if (!(Test-Path "$root/Rage-Racer.exe") -or
              !(Test-Path "$root/tools/rage-launcher.py") -or
              !(Test-Path "$root/rage-port.ini")) {
            throw "release package is incomplete"
          }
          (Get-FileHash "dist/$package.zip" -Algorithm SHA256).Hash
      - uses: actions/upload-artifact@v4
        with:
          name: Rage-Racer-${{ inputs.version || github.ref_name }}-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        shell: pwsh
        run: gh release upload $env:VERSION (Get-ChildItem dist/*.zip) --clobber
