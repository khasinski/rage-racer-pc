name: Windows x86-64 release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version used in the archive name
        required: true
        default: 0.6.9-alpha
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: Configure
        run: >-
          cmake -S . -B build/release -G "Visual Studio 17 2022" -A x64
          -T ClangCL -DRAGE_EMBED_AUTHORED_CARS=OFF
      - name: Build
        run: >-
          cmake --build build/release --config Release --parallel
      - name: Verify unit and functional tests
        run: >-
          ctest --test-dir build/release -C Release --output-on-failure
          -L '^(unit|functional)$' --parallel 4
      - name: Build standalone editor package
        working-directory: launcher
        shell: pwsh
        run: |
          npm ci
          $env:RAGE_LAUNCHER_BUILD_DIR = "../build/release"
          npm run build:native
          npm run package
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $package = "Rage-Racer-$env:VERSION-windows-x86_64"
          $root = "dist/$package"
          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item build/release/Release/rage-racer.exe "$root/Rage-Racer.exe"
          Copy-Item README.md, LICENSE.md, rage-port.ini, race-scenario.ini, cars.toml, cars.ntscj.toml $root
          New-Item -ItemType Directory -Force "$root/docs" | Out-Null
          Get-Content packaging/release-docs.txt | ForEach-Object { Copy-Item "docs/$_" "$root/docs/" }
          if (Test-Path "docs/release-$env:VERSION.md") { Copy-Item "docs/release-$env:VERSION.md" "$root/docs/" }
          Compress-Archive -Path $root -DestinationPath "dist/$package.zip" -Force
          if (!(Test-Path "$root/Rage-Racer.exe") -or
              !(Test-Path "$root/rage-port.ini")) {
            throw "release package is incomplete"
          }
          if (!(Test-Path "$root/cars.toml") -or !(Test-Path "$root/cars.ntscj.toml")) {
            throw "release package is missing car catalog templates"
          }
          if (Get-ChildItem $root -Recurse -Filter *.py) {
            throw "Python file found in release archive"
          }

          $editorPackage = "Rage-Racer-Editor-$env:VERSION-windows-x86_64"
          $editorRoot = "dist/$editorPackage"
          New-Item -ItemType Directory -Force $editorRoot | Out-Null
          Copy-Item -Path "launcher/out/Rage Racer Editor-win32-x64/*" -Destination $editorRoot -Recurse -Force
          Copy-Item README.md, LICENSE.md $editorRoot
          Compress-Archive -Path $editorRoot -DestinationPath "dist/$editorPackage.zip" -Force
          if (!(Test-Path "$editorRoot/rage-launcher.exe")) {
            throw "standalone editor package is incomplete"
          }
          (Get-FileHash "dist/$package.zip", "dist/$editorPackage.zip" -Algorithm SHA256).Hash
      - uses: actions/upload-artifact@v4
        with:
          name: Rage-Racer-${{ inputs.version || github.ref_name }}-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        shell: pwsh
        run: gh release upload $env:VERSION (Get-ChildItem dist/*.zip) --clobber
