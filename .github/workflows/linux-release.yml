name: Linux x86-64 release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version used in the archive name
        required: true
        default: 0.6.10-alpha
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: Install SDL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libdbus-1-dev libdecor-0-dev libegl1-mesa-dev \
            libgl1-mesa-dev libglvnd-dev libibus-1.0-dev libpulse-dev \
            libudev-dev libwayland-dev libx11-dev libxcursor-dev libxext-dev \
            libxfixes-dev libxi-dev libxkbcommon-dev libxrandr-dev libxss-dev \
            libxtst-dev
      - name: Configure
        run: cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release -DRAGE_EMBED_AUTHORED_CARS=OFF
      - name: Build
        run: cmake --build build/release --parallel
      - name: Verify unit and functional tests
        run: >-
          ctest --test-dir build/release --output-on-failure
          -L '^(unit|functional)$' --parallel 4
      - name: Build standalone editor package
        working-directory: launcher
        run: |
          npm ci
          RAGE_LAUNCHER_BUILD_DIR=../build/release npm run build:native
          npm run package
      - name: Package
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          package="Rage-Racer-${VERSION}-linux-x86_64"
          mkdir -p "dist/${package}"
          cp build/release/rage-racer "dist/${package}/rage-racer"
          cp README.md LICENSE.md rage-port.ini race-scenario.ini cars.toml cars.ntscj.toml "dist/${package}/"
          mkdir -p "dist/${package}/docs"
          while read -r doc; do cp "docs/${doc}" "dist/${package}/docs/"; done < packaging/release-docs.txt
          if [ -f "docs/release-${VERSION}.md" ]; then cp "docs/release-${VERSION}.md" "dist/${package}/docs/"; fi
          cp packaging/icon/rage-racer.png "dist/${package}/"
          (cd dist && zip -qr "${package}.zip" "${package}")
          test -x "dist/${package}/rage-racer"
          unzip -l "dist/${package}.zip" | grep -q "/rage-port.ini$"
          unzip -l "dist/${package}.zip" | grep -q "/cars.toml$"
          unzip -l "dist/${package}.zip" | grep -q "/rage-racer.png$"
          if unzip -l "dist/${package}.zip" | grep -E '\.py$'; then
            echo "Python file found in release archive" >&2
            exit 1
          fi

          editor_package="Rage-Racer-Editor-${VERSION}-linux-x86_64"
          mkdir -p "dist/${editor_package}"
          cp -a "launcher/out/Rage Racer Editor-linux-x64/." "dist/${editor_package}/"
          cp README.md LICENSE.md "dist/${editor_package}/"
          (cd dist && zip -qr "${editor_package}.zip" "${editor_package}")
          test -x "dist/${editor_package}/rage-launcher"
          for deb in launcher/out/*.deb; do
            if [ -f "$deb" ]; then
              cp "$deb" "dist/Rage-Racer-Editor-${VERSION}-linux-amd64.deb"
            fi
          done
          sha256sum "dist/${package}.zip" "dist/${editor_package}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Rage-Racer-${{ inputs.version || github.ref_name }}-linux-x86_64
          path: |
            dist/*.zip
            dist/*.deb
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: gh release upload "$VERSION" dist/*.zip dist/*.deb --clobber
