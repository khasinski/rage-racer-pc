name: Linux x86-64 release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version used in the archive name
        required: true
        default: 0.6.3-alpha
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SDL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libdbus-1-dev libdecor-0-dev libegl1-mesa-dev \
            libgl1-mesa-dev libglvnd-dev libibus-1.0-dev libpulse-dev \
            libudev-dev libwayland-dev libx11-dev libxcursor-dev libxext-dev \
            libxfixes-dev libxi-dev libxkbcommon-dev libxrandr-dev libxss-dev \
            libxtst-dev
      - name: Configure
        run: cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/release --parallel
      - name: Verify portable tests
        run: >-
          ctest --test-dir build/release --output-on-failure
          -R '^(game_logic|rmesh|rmesh_index|asset_id|car_paint|texture_mipmap|mod_manifest|render_material|rmesh_cache|render_world|render_world_snapshot|track_asset_identity|track_lighting|render_mesh_build|release_package|timing_restore|axis_curve)$'
      - name: Build the save editor
        run: |
          cmake -S editor -B build/editor -DCMAKE_BUILD_TYPE=Release
          cmake --build build/editor --parallel
          ctest --test-dir build/editor --output-on-failure
      - name: Package the save editor
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          package="Rage-Racer-Save-Editor-${VERSION}-linux-x86_64"
          mkdir -p "dist/${package}"
          cp build/editor/rage-save-editor "dist/${package}/"
          cp editor/README.md "dist/${package}/README.md"
          cp LICENSE.md "dist/${package}/"
          (cd dist && zip -r "${package}.zip" "${package}")
      - name: Package
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          package="Rage-Racer-${VERSION}-linux-x86_64"
          mkdir -p "dist/${package}"
          cp build/release/rage-racer "dist/${package}/rage-racer"
          cp README.md LICENSE.md rage-port.ini race-scenario.ini "dist/${package}/"
          cp packaging/linux/rage-racer.desktop "dist/${package}/"
          cp packaging/icon/rage-racer.png "dist/${package}/"
          (cd dist && zip -qr "${package}.zip" "${package}")
          test -x "dist/${package}/rage-racer"
          unzip -l "dist/${package}.zip" | grep -q "/rage-port.ini$"
          unzip -l "dist/${package}.zip" | grep -q "/rage-racer.png$"
          if unzip -l "dist/${package}.zip" | grep -E '\.py$'; then
            echo "Python file found in release archive" >&2
            exit 1
          fi
          sha256sum "dist/${package}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Rage-Racer-${{ inputs.version || github.ref_name }}-linux-x86_64
          path: dist/*.zip
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release upload "$VERSION" dist/*.zip --clobber
