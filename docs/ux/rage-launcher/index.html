<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rage Racer Launcher — UX prototype</title>
<style>
:root{color-scheme:dark;--bg:#101319;--panel:#191e27;--line:#303846;--muted:#a3aec0;--text:#eef2f8;--accent:#c5fa72;--danger:#ffb49e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent)}button{cursor:pointer;color:inherit;background:#242c39;border:1px solid #414b5c;border-radius:8px;padding:9px 14px}button:hover{background:#354155}button.primary{background:var(--accent);border-color:var(--accent);color:#18200f;font-weight:700}button.quiet{background:transparent}button:disabled{opacity:.4;cursor:not-allowed}input,select{color:inherit;background:#10151d;border:1px solid #465165;border-radius:6px;padding:9px}input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}input[type=number]{width:105px}a{color:var(--accent)}h1,h2,h3,p{margin-top:0}h1{font-size:30px;letter-spacing:-1px;margin-bottom:8px}h2{font-size:19px}h3{font-size:15px;margin-bottom:6px}.muted,small{color:var(--muted)}small{font-size:12px}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:12px}.brand{font-size:17px;font-weight:750;letter-spacing:-.4px}.brand b{color:var(--accent);margin-right:10px}.pill{font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:4px 8px;border:1px solid #485464;border-radius:5px;color:var(--muted)}.shell{display:grid;grid-template-columns:218px 1fr;min-height:calc(100vh - 64px)}aside{padding:24px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}aside button{text-align:left;background:transparent;border-color:transparent;padding:12px}aside button.active{background:#2b3525;color:var(--accent)}aside .bottom{margin-top:auto;padding-top:40px}.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin:10px 0}.main{max-width:1500px;width:100%;padding:32px 36px}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.stack{display:grid;gap:18px}.grid{display:grid;grid-template-columns:1fr 300px;gap:24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}.banner{padding:14px 18px;border:1px solid #65734c;background:#262e20;border-radius:9px;margin:20px 0}.warn{border-color:#806443;background:#332a20;color:#ffe0af}.error{border-color:#aa6256;background:#382422;color:#ffd4c8}.mod{display:grid;grid-template-columns:24px 64px 1fr auto;align-items:center;gap:16px;padding:20px 0;border-top:1px solid var(--line)}.thumb{width:64px;height:58px;border-radius:8px;background:linear-gradient(145deg,#647653,#242e20);display:grid;place-items:center;font-size:28px}.mod p{margin:3px 0}.tag{display:inline-block;font-size:12px;color:var(--accent);margin-right:10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.editor{display:grid;grid-template-columns:190px minmax(260px,1fr) 270px;gap:16px}.assets button{display:block;width:100%;text-align:left;margin:6px 0}.selected{border-color:var(--accent)!important;color:var(--accent)}.viewport{position:relative;min-height:340px;background:radial-gradient(ellipse at 50% 55%,#394353,#161c25 70%);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;justify-content:center}.viewport svg{width:100%;height:auto}.viewport-label{position:absolute;top:16px;left:18px;color:#c6d0df;font-size:12px}.viewport-note{padding:12px 16px;font-size:11px;color:#b8c4d5}.props label{display:block;margin:16px 0 6px}.props select{width:100%}.swatches{display:flex;gap:8px}.swatches button{width:28px;height:28px;padding:0;border:2px solid #8590a0}.footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}.steps{display:flex;gap:10px;margin-bottom:28px}.steps span{border-bottom:2px solid var(--line);padding:8px 12px;color:var(--muted)}.steps .on{border-color:var(--accent);color:var(--accent)}.hero{max-width:760px;margin:30px auto}.drop{border:1px dashed #687889;background:#141a23;border-radius:12px;text-align:center;padding:38px 24px;margin:24px 0}.detail{border-top:1px solid var(--line);padding:14px 0}.time{display:flex;align-items:center;gap:8px}.time label{display:grid;gap:4px}.time input{width:76px;font-size:22px;font-variant-numeric:tabular-nums;text-align:center}.time strong{font-size:22px}.fieldrow{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:20px 0;border-top:1px solid var(--line)}.stepper{display:flex;gap:6px}.stepper input{width:130px}.time-error{min-height:24px;color:var(--danger);margin-top:8px}.meter{height:8px;background:#111820;border-radius:5px;overflow:hidden;margin:16px 0}.meter i{display:block;height:100%;background:var(--accent);transition:width .3s}.empty{text-align:center;padding:48px 18px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}.compare .viewport{min-height:250px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#d4f2b1;color:#1b2813;border-radius:9px;padding:14px 24px;box-shadow:0 10px 40px #0008;z-index:8;max-width:90vw}dialog{background:var(--panel);color:var(--text);border:1px solid #536075;border-radius:16px;padding:28px;max-width:540px;width:90%}dialog::backdrop{background:#0009}dialog footer{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.scenario{margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}.scenario select{width:100%;font-size:12px}details summary{cursor:pointer;color:var(--muted)}@media(max-width:1100px){.main{padding:24px}.editor{grid-template-columns:160px 1fr}.props{grid-column:1/-1}.grid{grid-template-columns:1fr}.shell{grid-template-columns:185px 1fr}}@media(max-width:720px){.shell{display:block}aside{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;padding:12px}aside .eyebrow,aside .bottom{display:none}aside button{padding:8px}.main{padding:20px}.editor{display:block}.assets{margin-bottom:16px}.assets button{display:inline-block;width:auto}.props{margin-top:16px}.top{padding:0 16px}.top .muted{display:none}.fieldrow{align-items:flex-start;flex-direction:column}.mod{grid-template-columns:24px 1fr auto}.thumb{display:none}.compare{grid-template-columns:1fr}.row.between{flex-wrap:wrap}}
</style>
<link rel="stylesheet" href="launcher.css">
<header class="top"><div class="brand"><b>R /</b>Rage Racer Launcher</div><div class="row"><span class="muted">Desktop concept · Windows / macOS / Linux</span><span class="pill">UX prototype · demo data</span></div></header>
<div class="shell"><aside><div class="eyebrow">Your game</div><button data-nav="home">▷ &nbsp; Play</button><button data-nav="settings">⚙ &nbsp; Settings</button><button data-nav="mods">◫ &nbsp; My mods</button><button data-nav="setup">◉ &nbsp; Game source</button><div class="eyebrow">Workshop</div><button data-nav="editor">◇ &nbsp; Mod editor</button><button data-nav="save">▤ &nbsp; Save editor</button><button data-nav="package">↗ &nbsp; Build package</button><div class="bottom"><small>Interactive design prototype.<br>Demo settings are stored in this browser. Game files are not modified.</small><div class="scenario"><label for="scenario" class="eyebrow">Demo scenario</label><select id="scenario"><option value="normal">First launch · no game</option><option value="ready">Prepared game · demo</option><option value="empty">Empty library</option><option value="conflict">Mod conflict</option><option value="error">Import error</option></select></div></div></aside><main id="main" class="main"></main></div>
<dialog id="dialog"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script src="launcher.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const state={page:'home',installed:false,enabled:false,conflict:false,ready:false,dirty:false,compare:false,asset:'Esperanza',material:'Paint',color:'#b6e475',time:100765,credits:125000,progress:0,failed:false};
let timer,toastTimer;
function toast(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,4500)}
function modal(title,body,actions){const d=$('#dialog');d.innerHTML=`<h2>${title}</h2>${body}<footer>${actions}</footer>`;d.showModal()}
function go(page){if(!state.ready&&!["home","setup"].includes(page))return;if(page===state.page)return;if(state.dirty){modal('You have unsaved changes','<p>Save them to the demo project or discard them before leaving this screen.</p>',`<button data-action="close">Stay here</button><button data-action="discard" data-page="${page}">Discard</button><button class="primary" data-action="save-leave" data-page="${page}">Save and continue</button>`);return}state.page=page;render()}
function title(kicker,heading,desc,action=''){return `<div class="row between"><div><div class="eyebrow">${kicker}</div><h1>${heading}</h1><p class="muted">${desc}</p></div>${action}</div>`}
function car(original=false){return `<svg viewBox="0 0 620 320" role="img" aria-label="Car schematic illustrating the preview layout; not an in-game model"><ellipse cx="315" cy="270" rx="240" ry="18" fill="#080c13" opacity=".55"/><path d="M38 271H587M85 296L242 143M243 303L316 140M404 302L390 144M557 294L464 149" stroke="#536073" opacity=".22"/><path d="M77 211L111 177L208 157L268 107L386 110L454 163L536 185L551 224L513 245H111L77 232Z" fill="${original?'#99a2ae':state.color}" stroke="#dae9f4" stroke-width="2"/><path d="M224 158L277 117H324V159Z M337 118L379 120L426 161L339 159Z" fill="${state.material==='Glass'?'#608ca1':'#253947'}" stroke="#7192a3" stroke-width="2"/><path d="M218 165L220 227M334 165V228M449 171L460 214M93 207L204 198M451 176L530 197" fill="none" stroke="#273329" stroke-width="2"/><path d="M245 173H267M358 175H379" stroke="#354638" stroke-width="5"/><path d="M94 206L124 193H155L141 210Z M504 190L532 198L537 210L510 205Z" fill="#eff5e6"/><g fill="#131820" stroke="#29333d" stroke-width="9"><circle cx="169" cy="236" r="${original?31:36}"/><circle cx="458" cy="236" r="${original?31:36}"/></g><g fill="#818e9e" stroke="#d0d7df" stroke-width="3"><circle cx="169" cy="236" r="22"/><circle cx="458" cy="236" r="22"/></g><g fill="#222c38"><circle cx="169" cy="236" r="9"/><circle cx="458" cy="236" r="9"/></g><path d="M126 235a43 43 0 0 1 86 0M415 235a43 43 0 0 1 86 0" stroke="${original?'#7f8996':state.color}" stroke-width="7" fill="none"/><text x="278" y="130" font-size="9" fill="white" font-family="sans-serif">TEAM RAGE</text><path d="M480 186l12 3-6 7-12-3Z" fill="#25323b"/></svg>`}
function view(original=false){return `<div class="viewport"><span class="viewport-label">${original?'Original':'Modified'} · schematic preview</span>${car(original)}<div class="viewport-note">UX schematic — the final viewer will support 3D orbit and zoom.</div></div>`}
function mods(){return title('Library','Your game, your mods','Enable your mods and play with your profile.','<button class="primary" data-action="install">＋ Install mod</button>')+`<div class="row between toolbar"><span>Profile &nbsp; <b>My setup</b></span><span class="muted">${state.ready?'● Game source ready':'○ Select a game source'}</span></div>${state.conflict?'<div class="banner warn row between"><span><b>2 mods change the paint on the Esperanza.</b><br>Choose which one takes priority.</span><button data-action="conflict">Resolve conflict</button></div>':''}<div class="grid"><section class="card"><h2>Installed</h2>${state.installed?`<div class="mod"><input aria-label="Enable Rounded cars" type="checkbox" id="enabled" ${state.enabled?'checked':''}><div class="thumb">◇</div><div><h3>Rounded cars</h3><p class="muted">Rounded wheels, wheel wells and separate materials.</p><span class="tag">Cars</span><small>v0.1 · local project · demo data</small></div><button data-action="details">Details</button></div>${state.conflict?'<div class="mod"><input type="checkbox" checked disabled aria-label="Racing paint enabled"><div class="thumb">◈</div><div><h3>Racing paint</h3><span class="muted">Changes the same material</span></div><span>Conflict</span></div>':''}`:'<div class="empty"><h2>Your first mods go here</h2><p class="muted">Install a package to see what it changes.</p><button data-action="install">Choose a demo package</button></div>'}</section><section class="card"><div class="eyebrow">Launch status</div><h2>${state.conflict?'Action needed':state.ready?'Ready to play':'Game source required'}</h2><p class="muted">${state.installed&&state.enabled?'Rounded cars is enabled.':'The game will use its original assets.'}</p><p class="muted">Your disc image stays unchanged.</p><button class="primary" data-action="play" ${state.conflict?'disabled':''}>${state.ready?'▶ Play':'Choose a disc image'}</button><p style="margin-top:16px"><small>In this prototype, the button previews the launch flow.</small></p></section></div>`}
function setup(){const importing=state.progress>0&&state.progress<100;return `<div class="hero"><div class="eyebrow">${state.ready?'Game source':'Welcome to Rage Racer Launcher'}</div><h1>${state.ready?'Your game is ready':'Start with your copy of the game'}</h1><p class="muted">${state.ready?'Game content is determined by the loaded disc version.':'Select a legally obtained disc image. We will identify the game version and prepare its models, textures and other assets automatically.'}</p><div class="steps"><span class="on">1 · Select image</span><span class="${state.progress?'on':''}">2 · Prepare data</span><span class="${state.ready?'on':''}">3 · Play</span></div>${!importing&&!state.ready?'<div class="drop"><h2>CUE, CHD or Track 01 BIN</h2><p class="muted">The desktop app will let you browse for a file or drop it here.</p><button class="primary" data-action="source">Choose disc image · demo</button><p style="margin:14px 0 0"><small>Uses a sample disc for this prototype. No file is opened.</small></p></div>':''}${importing?`<section class="card" aria-live="polite"><div class="row between"><b>Preparing game data…</b><span>${state.progress}%</span></div><div class="meter"><i style="width:${state.progress}%"></i></div><p class="muted">Importing models, textures and materials for the modern renderer.</p><button data-action="cancel-import">Cancel</button></section>`:''}${state.ready?'<section class="card"><h2>Rage Racer · North America</h2><p class="muted">Detected from the sample image · NTSC-U</p><div class="detail"><strong>Car names and prologue</strong><p class="muted" style="margin:6px 0">International content, matching this disc version.</p></div><div class="row wrap"><button class="primary" data-action="library">Continue to launcher</button><button data-action="source">Change image · demo</button></div></section>':''}${state.failed?'<div class="banner error" role="alert"><b>Could not read the disc image.</b><p style="margin:6px 0">Example: the BIN file referenced by the CUE is missing. Keep the CUE and its track files together, then choose the image again.</p><small>Your workspace remains unavailable until preparation succeeds.</small></div>':''}${!state.ready?'<div class="card" style="margin-top:22px"><h3>Your workspace unlocks after preparation</h3><p class="muted" style="margin:0">Game settings, save editing, mod management and asset tools need the loaded game data. No extra converter or setup command is required.</p></div>':''}<p class="prototype-footer">Processing stays on your computer. Your original disc image is not modified.</p></div>`}
function editor(){return title('Workshop / Rounded cars',state.asset,'Local project · cars and materials',`<span class="pill">${state.dirty?'Unsaved changes':'Saved'}</span>`)+`<div class="toolbar"><button data-action="export">Export OBJ + MTL</button><button data-action="import">Import model</button><button data-action="compare" class="${state.compare?'selected':''}">Compare with original</button><button data-action="test">Test in game</button></div><div class="editor"><section class="card assets"><label for="search">Find an asset</label><input id="search" placeholder="Car name…" style="width:100%;margin:10px 0"><div class="eyebrow">Cars</div>${['Esperanza','Vainqure','Bulshade'].map(n=>`<button data-asset="${n}" class="${state.asset===n?'selected':''}">${n}</button>`).join('')}<details style="margin-top:24px"><summary>Other assets</summary><p class="muted">Textures and known parameters will have dedicated editors. Unknown entries will be labeled as raw data.</p></details></section><div>${state.compare?`<div class="compare">${view(true)}${view()}</div>`:view()}<div class="card" style="margin-top:16px"><h3>Pre-test checks</h3><div class="row wrap muted"><span>✓ Separate glass and paint</span><span>✓ Wheels and inner wheel wells</span><span>✓ Logo and windshield lettering</span></div><small>Sample results. Import validation and visual checks will be shown separately in the app.</small></div></div><section class="card props"><h2>Material</h2><label for="material">Car part</label><select id="material">${['Paint','Glass','Rubber','Metal','Decals'].map(x=>`<option ${state.material===x?'selected':''}>${x}</option>`).join('')}</select><label>Base color</label><div class="swatches">${['#b6e475','#77b8df','#df886b','#d6dbe4'].map((c,i)=>`<button aria-label="${['Lime','Blue','Copper','Silver'][i]}" data-color="${c}" style="background:${c}" class="${state.color===c?'selected':''}"></button>`).join('')}</div><label for="roughness">Roughness</label><input type="number" id="roughness" min="0" max="1" step="0.05" value="0.35"><p><small>0 — smooth surface<br>1 — matte surface</small></p><details><summary>Technical details</summary><p><small>Material identifiers and source mappings will appear here. You do not need them to edit a car.</small></p></details></section></div><div class="footer"><span id="dirty-status" class="muted">${state.dirty?'● Project has changes':'No unsaved changes'}</span><div class="row"><button data-action="restore">Restore original</button><button class="primary" data-action="save-project">Save project</button></div></div>`}
function save(){const t=state.time;return title('Save editor / sample file','Team RAGE','Precise values without sliders or typing separators.')+`<div class="grid"><section class="card"><h2>Progress and records</h2><div class="fieldrow"><div><h3>Credits</h3><small>Type an amount or adjust in steps of 1,000.</small></div><div class="stepper"><button data-action="minus" aria-label="Subtract 1,000 credits">−</button><input id="credits" aria-label="Credits" type="number" min="0" max="999999999" step="1000" value="${state.credits}"><button data-action="plus" aria-label="Add 1,000 credits">+</button></div></div><div class="fieldrow"><div><h3>Best lap</h3><small>Mythical Coast · Press Tab to move to the next segment.</small></div><div><label class="row"><input type="checkbox" id="no-record"> No record</label><div class="time" style="margin-top:12px"><label><small>min</small><input id="minutes" type="number" aria-label="Minutes" min="0" max="35791" value="${Math.floor(t/60000)}"></label><strong>:</strong><label><small>sec</small><input id="seconds" type="number" aria-label="Seconds" min="0" max="59" value="${Math.floor(t/1000)%60}"></label><strong>.</strong><label><small>ms</small><input id="millis" type="number" aria-label="Milliseconds" min="0" max="999" value="${t%1000}"></label></div><div id="time-error" class="time-error" role="alert"></div></div></div><div class="fieldrow"><div><h3>Transmission</h3><small>Esperanza</small></div><select id="gearbox" aria-label="Transmission"><option>Automatic</option><option>Manual</option></select></div><div class="footer"><span id="save-status" class="muted">The original file stays unchanged.</span><button class="primary" id="save-copy" data-action="save-copy">Save a copy</button></div></section><section class="card"><h2>Try it out</h2><p>Enter <b>60</b> seconds: an error appears without silently changing your number.</p><p>Enter <b>40</b>, select “No record”, then return to editing the time.</p><p>Press <b>Escape</b> to revert the active field.</p><small>Ranges are UX examples. Final limits and the no-record value depend on the save format.</small></section></div>`}
function pack(){return title('Workshop / publishing','Build a mod package','Review the exact contents before exporting.')+`<div class="grid"><section class="card"><h2>Rounded cars <small>0.1</small></h2><div class="detail row between"><span>Modified car models</span><span>3 demo files</span></div><div class="detail row between"><span>Material settings</span><span>5 changes</span></div><div class="detail row between"><span>Manifest and description</span><span>2 demo files</span></div><div class="banner warn"><b>Review content provenance</b><p style="margin:6px 0">Models based on the original cars require a separate review of redistribution rights. A different hosting site does not change those rights.</p></div><p class="muted">The disc image, full extracted RAGE.BIN and original texture cache are excluded from this package.</p><button class="primary" data-action="build">Build demo package</button></section><section class="card"><h2>After export</h2><p>Install the package in a clean profile and check the result in the game.</p><p class="muted">Export is local. Publishing is a separate step.</p></section></div>`}
function render(){saveSession();if(!state.ready&&!['home','setup'].includes(state.page))state.page='home';document.querySelectorAll('[data-nav]').forEach(b=>{b.classList.toggle('active',b.dataset.nav===state.page);b.disabled=!state.ready&&!['home','setup'].includes(b.dataset.nav);b.title=b.disabled?'Add and prepare a game image first':'';});$('#main').innerHTML=(!state.ready?setup:({home,settings,mods,setup,editor,save,package:pack}[state.page]))();}
function mark(){state.dirty=true;const s=$('#dirty-status');if(s)s.textContent='● Project has changes';const s2=$('#save-status');if(s2)s2.textContent='● Unsaved changes';}
function validateTime(){const parts=['minutes','seconds','millis'].map(id=>$('#'+id));const off=$('#no-record').checked;parts.forEach(p=>p.disabled=off);let valid=off||parts.every(p=>p.value!==''&&p.validity.valid&&Number.isInteger(Number(p.value)));if(!off&&valid)valid=Number(parts[0].value)*60000+Number(parts[1].value)*1000+Number(parts[2].value)<=2147483647;$('#time-error').textContent=valid?'':'Enter a valid time: seconds 0–59, milliseconds 0–999, within the supported total range.';parts.forEach(p=>p.setAttribute('aria-invalid',String(!valid)));const credits=$('#credits');$('#save-copy').disabled=!valid||!credits.validity.valid||credits.value==='';return valid}
document.addEventListener('focusin',e=>{if(e.target.matches('input[type=number]'))e.target.dataset.before=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&e.target.matches('input[type=number]')){e.target.value=e.target.dataset.before??e.target.value;if(state.page==='save')validateTime();e.stopPropagation()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){document.querySelectorAll('[data-asset]').forEach(b=>b.hidden=!b.dataset.asset.toLowerCase().includes(e.target.value.toLowerCase()));return}if(state.page==='save'){mark();validateTime()}if(e.target.id==='roughness')mark()});
document.addEventListener('change',e=>{if(e.target.id==='enabled'){state.enabled=e.target.checked;render()}if(e.target.id==='material'){state.material=e.target.value;render()}if(e.target.id==='no-record'){mark();validateTime()}if(e.target.id==='gearbox')mark();if(e.target.id==='scenario'){clearInterval(timer);state.dirty=false;state.failed=false;state.progress=0;state.conflict=e.target.value==='conflict';state.ready=['ready','empty','conflict'].includes(e.target.value);state.installed=e.target.value==='conflict';state.enabled=state.installed;draftSettings={...savedSettings};state.page=e.target.value==='error'?'setup':e.target.value==='normal'||e.target.value==='ready'?'home':'mods';state.failed=e.target.value==='error';render()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav){go(b.dataset.nav);return}if(b.dataset.asset){if(state.dirty){toast('Save the project or restore the original first.');return}state.asset=b.dataset.asset;render();return}if(b.dataset.color){state.color=b.dataset.color;mark();render();return}const a=b.dataset.action;if(a==='close')$('#dialog').close();if(a==='discard'||a==='save-leave'){state.dirty=false;$('#dialog').close();state.page=b.dataset.page;render();if(a==='save-leave')toast('Saved in this demo session.')}if(a==='install')modal('Install Rounded cars','<p>Sample package · v0.1</p><p>Changes car models and materials. This previews the confirmation shown after selecting a file.</p>','<button data-action="close">Cancel</button><button class="primary" data-action="confirm-install">Install and enable</button>');if(a==='confirm-install'){state.installed=true;state.enabled=true;$('#dialog').close();render();toast('Demo mod installed and enabled.')}if(a==='conflict')modal('Which paint should be visible?','<p>Both mods change the Esperanza body material. Other changes will remain active.</p><label class="row"><input type="radio" name="winner" checked> Rounded cars</label><label class="row"><input type="radio" name="winner"> Racing paint</label>','<button data-action="close">Back</button><button class="primary" data-action="resolve">Apply selection</button>');if(a==='resolve'){state.conflict=false;$('#dialog').close();render();toast('Material priority saved in the demo profile.')}if(a==='details')modal('Rounded cars','<p>Changes: rounded wheels, inner wheel wells, glass and body materials.</p><p class="muted">Author: local project · version 0.1 · demo data</p>','<button data-action="close">Close</button><button data-action="remove">Uninstall</button>');if(a==='remove'){state.installed=false;state.enabled=false;$('#dialog').close();render();toast('Mod removed from the demo library.')}if(a==='source'){state.failed=false;state.progress=5;state.ready=false;clearInterval(timer);render();timer=setInterval(()=>{state.progress=Math.min(100,state.progress+19);if(state.progress===100){clearInterval(timer);state.ready=true}if(['setup','home'].includes(state.page))render()},650)}if(a==='cancel-import'){clearInterval(timer);state.progress=0;render();toast('Preparation canceled. You can choose an image again.')}if(a==='library'){state.page='home';render();}if(a==='play')launchDemo();if(a==='compare'){state.compare=!state.compare;render()}if(a==='export')toast('Demo: export an OBJ model, MTL materials and linked textures.');if(a==='import')modal('Import preview','<p>esperanza.obj · sample result</p><p>✓ Model and wheels recognized<br>✓ Glass and paint materials separated<br>✓ Texture references complete</p><p class="muted">After applying, check the hood logo and windshield lettering in the game.</p>','<button data-action="close">Cancel</button><button class="primary" data-action="apply-import">Apply to project</button>');if(a==='apply-import'){mark();$('#dialog').close();render()}if(a==='test')toast('Demo: save a test version → prepare assets → launch the game with the selected car.');if(a==='restore'){state.color='#b6e475';state.dirty=false;render();toast('Initial prototype values restored.')}if(a==='save-project'){state.dirty=false;render();toast('Project saved in this demo session. No file was written.')}if(a==='minus'||a==='plus'){const c=$('#credits');c.value=Math.max(0,Math.min(999999999,Number(c.value)+(a==='plus'?1000:-1000)));mark();validateTime()}if(a==='save-copy'&&validateTime()){state.credits=Number($('#credits').value);if(!$('#no-record').checked)state.time=Number($('#minutes').value)*60000+Number($('#seconds').value)*1000+Number($('#millis').value);state.dirty=false;$('#save-status').textContent='Demo copy saved.';toast('Demo: save a copy with recalculated checksums.')}if(a==='build')toast('Demo: validate contents → export a local package. No automatic publishing.');});
loadSession();
render();
