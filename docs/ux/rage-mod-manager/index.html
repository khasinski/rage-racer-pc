<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rage Mod Manager — prototyp UX</title>
<style>
:root{color-scheme:dark;--bg:#101319;--panel:#191e27;--line:#303846;--muted:#a3aec0;--text:#eef2f8;--accent:#c5fa72;--danger:#ffb49e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent)}button{cursor:pointer;color:inherit;background:#242c39;border:1px solid #414b5c;border-radius:8px;padding:9px 14px}button:hover{background:#354155}button.primary{background:var(--accent);border-color:var(--accent);color:#18200f;font-weight:700}button.quiet{background:transparent}button:disabled{opacity:.4;cursor:not-allowed}input,select{color:inherit;background:#10151d;border:1px solid #465165;border-radius:6px;padding:9px}input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}input[type=number]{width:105px}a{color:var(--accent)}h1,h2,h3,p{margin-top:0}h1{font-size:30px;letter-spacing:-1px;margin-bottom:8px}h2{font-size:19px}h3{font-size:15px;margin-bottom:6px}.muted,small{color:var(--muted)}small{font-size:12px}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:12px}.brand{font-size:17px;font-weight:750;letter-spacing:-.4px}.brand b{color:var(--accent);margin-right:10px}.pill{font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:4px 8px;border:1px solid #485464;border-radius:5px;color:var(--muted)}.shell{display:grid;grid-template-columns:218px 1fr;min-height:calc(100vh - 64px)}aside{padding:24px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}aside button{text-align:left;background:transparent;border-color:transparent;padding:12px}aside button.active{background:#2b3525;color:var(--accent)}aside .bottom{margin-top:auto;padding-top:40px}.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin:10px 0}.main{max-width:1500px;width:100%;padding:32px 36px}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.stack{display:grid;gap:18px}.grid{display:grid;grid-template-columns:1fr 300px;gap:24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}.banner{padding:14px 18px;border:1px solid #65734c;background:#262e20;border-radius:9px;margin:20px 0}.warn{border-color:#806443;background:#332a20;color:#ffe0af}.error{border-color:#aa6256;background:#382422;color:#ffd4c8}.mod{display:grid;grid-template-columns:24px 64px 1fr auto;align-items:center;gap:16px;padding:20px 0;border-top:1px solid var(--line)}.thumb{width:64px;height:58px;border-radius:8px;background:linear-gradient(145deg,#647653,#242e20);display:grid;place-items:center;font-size:28px}.mod p{margin:3px 0}.tag{display:inline-block;font-size:12px;color:var(--accent);margin-right:10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.editor{display:grid;grid-template-columns:190px minmax(260px,1fr) 270px;gap:16px}.assets button{display:block;width:100%;text-align:left;margin:6px 0}.selected{border-color:var(--accent)!important;color:var(--accent)}.viewport{position:relative;min-height:340px;background:radial-gradient(ellipse at 50% 55%,#394353,#161c25 70%);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;justify-content:center}.viewport svg{width:100%;height:auto}.viewport-label{position:absolute;top:16px;left:18px;color:#c6d0df;font-size:12px}.viewport-note{padding:12px 16px;font-size:11px;color:#b8c4d5}.props label{display:block;margin:16px 0 6px}.props select{width:100%}.swatches{display:flex;gap:8px}.swatches button{width:28px;height:28px;padding:0;border:2px solid #8590a0}.footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}.steps{display:flex;gap:10px;margin-bottom:28px}.steps span{border-bottom:2px solid var(--line);padding:8px 12px;color:var(--muted)}.steps .on{border-color:var(--accent);color:var(--accent)}.hero{max-width:760px;margin:30px auto}.drop{border:1px dashed #687889;background:#141a23;border-radius:12px;text-align:center;padding:38px 24px;margin:24px 0}.detail{border-top:1px solid var(--line);padding:14px 0}.time{display:flex;align-items:center;gap:8px}.time label{display:grid;gap:4px}.time input{width:76px;font-size:22px;font-variant-numeric:tabular-nums;text-align:center}.time strong{font-size:22px}.fieldrow{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:20px 0;border-top:1px solid var(--line)}.stepper{display:flex;gap:6px}.stepper input{width:130px}.time-error{min-height:24px;color:var(--danger);margin-top:8px}.meter{height:8px;background:#111820;border-radius:5px;overflow:hidden;margin:16px 0}.meter i{display:block;height:100%;background:var(--accent);transition:width .3s}.empty{text-align:center;padding:48px 18px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}.compare .viewport{min-height:250px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#d4f2b1;color:#1b2813;border-radius:9px;padding:14px 24px;box-shadow:0 10px 40px #0008;z-index:8;max-width:90vw}dialog{background:var(--panel);color:var(--text);border:1px solid #536075;border-radius:16px;padding:28px;max-width:540px;width:90%}dialog::backdrop{background:#0009}dialog footer{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.scenario{margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}.scenario select{width:100%;font-size:12px}details summary{cursor:pointer;color:var(--muted)}@media(max-width:1100px){.main{padding:24px}.editor{grid-template-columns:160px 1fr}.props{grid-column:1/-1}.grid{grid-template-columns:1fr}.shell{grid-template-columns:185px 1fr}}@media(max-width:720px){.shell{display:block}aside{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;padding:12px}aside .eyebrow,aside .bottom{display:none}aside button{padding:8px}.main{padding:20px}.editor{display:block}.assets{margin-bottom:16px}.assets button{display:inline-block;width:auto}.props{margin-top:16px}.top{padding:0 16px}.top .muted{display:none}.fieldrow{align-items:flex-start;flex-direction:column}.mod{grid-template-columns:24px 1fr auto}.thumb{display:none}.compare{grid-template-columns:1fr}.row.between{flex-wrap:wrap}}
</style>
<header class="top"><div class="brand"><b>R /</b>Rage Mod Manager</div><div class="row"><span class="muted">Windows · macOS · Linux</span><span class="pill">Prototyp UX · dane demo</span></div></header>
<div class="shell"><aside><div class="eyebrow">Biblioteka</div><button data-nav="mods">◫ &nbsp; Moje mody</button><button data-nav="setup">◉ &nbsp; Źródło gry</button><div class="eyebrow">Warsztat</div><button data-nav="editor">◇ &nbsp; Edytor moda</button><button data-nav="save">▤ &nbsp; Edytor zapisu</button><button data-nav="package">↗ &nbsp; Budowanie paczki</button><div class="bottom"><small>Makieta do oceny przepływów.<br>Nie czyta plików ani nie uruchamia gry.</small><div class="scenario"><label for="scenario" class="eyebrow">Scenariusz demonstracyjny</label><select id="scenario"><option value="normal">Zwykły przebieg</option><option value="empty">Pusta biblioteka</option><option value="conflict">Konflikt modów</option><option value="error">Błąd importu</option></select></div></div></aside><main id="main" class="main"></main></div>
<dialog id="dialog"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const state={page:'mods',installed:true,enabled:true,conflict:false,ready:true,dirty:false,compare:false,asset:'Esperanza',material:'Lakier',color:'#b6e475',time:100765,credits:125000,progress:0,failed:false};
let timer,toastTimer;
function toast(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,4500)}
function modal(title,body,actions){const d=$('#dialog');d.innerHTML=`<h2>${title}</h2>${body}<footer>${actions}</footer>`;d.showModal()}
function go(page){if(page===state.page)return;if(state.dirty){modal('Masz niezapisane zmiany','<p>Zapisz je w projekcie demo albo odrzuć przed zmianą widoku.</p>',`<button data-action="close">Zostań</button><button data-action="discard" data-page="${page}">Odrzuć</button><button class="primary" data-action="save-leave" data-page="${page}">Zapisz i przejdź</button>`);return}state.page=page;render()}
function title(kicker,heading,desc,action=''){return `<div class="row between"><div><div class="eyebrow">${kicker}</div><h1>${heading}</h1><p class="muted">${desc}</p></div>${action}</div>`}
function car(original=false){return `<svg viewBox="0 0 620 320" role="img" aria-label="Schemat auta; ilustracja układu podglądu, nie model z gry"><ellipse cx="315" cy="270" rx="240" ry="18" fill="#080c13" opacity=".55"/><path d="M38 271H587M85 296L242 143M243 303L316 140M404 302L390 144M557 294L464 149" stroke="#536073" opacity=".22"/><path d="M77 211L111 177L208 157L268 107L386 110L454 163L536 185L551 224L513 245H111L77 232Z" fill="${original?'#99a2ae':state.color}" stroke="#dae9f4" stroke-width="2"/><path d="M224 158L277 117H324V159Z M337 118L379 120L426 161L339 159Z" fill="${state.material==='Szyby'?'#608ca1':'#253947'}" stroke="#7192a3" stroke-width="2"/><path d="M218 165L220 227M334 165V228M449 171L460 214M93 207L204 198M451 176L530 197" fill="none" stroke="#273329" stroke-width="2"/><path d="M245 173H267M358 175H379" stroke="#354638" stroke-width="5"/><path d="M94 206L124 193H155L141 210Z M504 190L532 198L537 210L510 205Z" fill="#eff5e6"/><g fill="#131820" stroke="#29333d" stroke-width="9"><circle cx="169" cy="236" r="${original?31:36}"/><circle cx="458" cy="236" r="${original?31:36}"/></g><g fill="#818e9e" stroke="#d0d7df" stroke-width="3"><circle cx="169" cy="236" r="22"/><circle cx="458" cy="236" r="22"/></g><g fill="#222c38"><circle cx="169" cy="236" r="9"/><circle cx="458" cy="236" r="9"/></g><path d="M126 235a43 43 0 0 1 86 0M415 235a43 43 0 0 1 86 0" stroke="${original?'#7f8996':state.color}" stroke-width="7" fill="none"/><text x="278" y="130" font-size="9" fill="white" font-family="sans-serif">TEAM RAGE</text><path d="M480 186l12 3-6 7-12-3Z" fill="#25323b"/></svg>`}
function view(original=false){return `<div class="viewport"><span class="viewport-label">${original?'Oryginał':'Po zmianach'} · widok poglądowy</span>${car(original)}<div class="viewport-note">Schemat UX — docelowo interaktywny model 3D z obrotem i zoomem.</div></div>`}
function mods(){return title('Biblioteka','Twoja gra, Twoje mody','Włącz wybrane zmiany i graj na swoim profilu.','<button class="primary" data-action="install">＋ Zainstaluj mod</button>')+`<div class="row between toolbar"><label>Profil &nbsp; <select aria-label="Profil"><option>Moja konfiguracja</option><option>Oryginalna gra</option></select></label><span class="muted">${state.ready?'● Źródło gry gotowe':'○ Wybierz źródło gry'}</span></div>${state.conflict?'<div class="banner warn row between"><span><b>2 mody zmieniają lakier Esperanzy.</b><br>Wybierz, który ma pierwszeństwo.</span><button data-action="conflict">Rozwiąż konflikt</button></div>':''}<div class="grid"><section class="card"><h2>Zainstalowane</h2>${state.installed?`<div class="mod"><input aria-label="Włącz Rounded cars" type="checkbox" id="enabled" ${state.enabled?'checked':''}><div class="thumb">◇</div><div><h3>Rounded cars</h3><p class="muted">Zaokrąglone koła, nadkola i osobne materiały.</p><span class="tag">Samochody</span><small>v0.1 · projekt lokalny · dane demo</small></div><button data-action="details">Szczegóły</button></div>${state.conflict?'<div class="mod"><input type="checkbox" checked disabled aria-label="Lakier wyścigowy aktywny"><div class="thumb">◈</div><div><h3>Lakier wyścigowy</h3><span class="muted">Zmienia ten sam materiał</span></div><span>Konflikt</span></div>':''}`:'<div class="empty"><h2>Miejsce na Twoje pierwsze mody</h2><p class="muted">Zainstaluj paczkę, aby zobaczyć, co zmienia.</p><button data-action="install">Wybierz paczkę demo</button></div>'}</section><section class="card"><div class="eyebrow">Gotowość do gry</div><h2>${state.conflict?'Wymagana decyzja':state.ready?'Wszystko gotowe':'Brakuje źródła gry'}</h2><p class="muted">${state.installed&&state.enabled?'Rounded cars jest włączony.':'Uruchomisz oryginalne assety.'}</p><p class="muted">Plik obrazu gry pozostaje bez zmian.</p><button class="primary" data-action="play" ${state.conflict?'disabled':''}>${state.ready?'▶ Graj':'Wybierz obraz gry'}</button><p style="margin-top:16px"><small>W makiecie przycisk pokazuje stan uruchamiania.</small></p></section></div>`}
function setup(){return `<div class="hero"><div class="steps"><span class="on">1 · Źródło gry</span><span class="${state.progress?'on':''}">2 · Przygotowanie</span><span>3 · Gotowe</span></div>${title('Pierwszy start','Dodaj swoją kopię gry','Wybierz legalnie uzyskany obraz Rage Racer. Resztę przygotujemy automatycznie.')}<div class="drop"><h2>Obraz płyty CUE lub Track 01 BIN</h2><p class="muted">Docelowo możesz tu upuścić plik lub wybrać go z dysku.</p><button class="primary" data-action="source">Wybierz przykładowy obraz</button><p style="margin:14px 0 0"><small>Prototyp nie otwiera Twoich plików.</small></p></div>${state.progress?`<section class="card" aria-live="polite"><div class="row between"><b>${state.progress===100?'Gra przygotowana':'Przygotowywanie assetów…'}</b><span>${state.progress}%</span></div><div class="meter"><i style="width:${state.progress}%"></i></div><p class="muted">${state.progress===100?'Możesz instalować mody lub uruchomić grę.':'Modele, tekstury i materiały nowoczesnego renderera.'}</p><button data-action="${state.progress===100?'library':'cancel-import'}">${state.progress===100?'Przejdź do modów':'Anuluj'}</button></section>`:''}${state.failed?'<div class="banner error" role="alert"><b>Nie udało się odczytać obrazu.</b><br>Przykładowy błąd: plik BIN wskazany przez CUE jest niedostępny. Wybierz ponownie CUE z plikami ścieżek w tym samym folderze.<div class="toolbar"><button data-action="source">Wybierz ponownie</button></div></div>':''}<small>Przetwarzanie odbywa się lokalnie. Nie trzeba uruchamiać osobnego konwertera.</small></div>`}
function editor(){return title('Warsztat / Rounded cars',state.asset,'Projekt lokalny · samochody i materiały',`<span class="pill">${state.dirty?'Niezapisane zmiany':'Zapisano'}</span>`)+`<div class="toolbar"><button data-action="export">Eksportuj OBJ + MTL</button><button data-action="import">Importuj model</button><button data-action="compare" class="${state.compare?'selected':''}">Porównaj z oryginałem</button><button data-action="test">Testuj w grze</button></div><div class="editor"><section class="card assets"><label for="search">Szukaj assetu</label><input id="search" placeholder="Nazwa auta…" style="width:100%;margin:10px 0"><div class="eyebrow">Samochody</div>${['Esperanza','Vainqure','Bulshade'].map(n=>`<button data-asset="${n}" class="${state.asset===n?'selected':''}">${n}</button>`).join('')}<details style="margin-top:24px"><summary>Inne assety</summary><p class="muted">Tekstury i rozpoznane parametry otrzymają własne edytory. Nierozpoznane wpisy będą oznaczone jako dane surowe.</p></details></section><div>${state.compare?`<div class="compare">${view(true)}${view()}</div>`:view()}<div class="card" style="margin-top:16px"><h3>Kontrola przed testem</h3><div class="row wrap muted"><span>✓ Osobne szyby i lakier</span><span>✓ Koła i wnętrza nadkoli</span><span>✓ Logo i napis na szybie</span></div><small>Przykładowe wyniki. Docelowo oznaczymy osobno walidację importera i kontrolę wizualną.</small></div></div><section class="card props"><h2>Materiał</h2><label for="material">Część samochodu</label><select id="material">${['Lakier','Szyby','Guma','Metal','Oznaczenia'].map(x=>`<option ${state.material===x?'selected':''}>${x}</option>`).join('')}</select><label>Kolor bazowy</label><div class="swatches">${['#b6e475','#77b8df','#df886b','#d6dbe4'].map((c,i)=>`<button aria-label="${['Limonkowy','Niebieski','Miedziany','Srebrny'][i]}" data-color="${c}" style="background:${c}" class="${state.color===c?'selected':''}"></button>`).join('')}</div><label for="roughness">Chropowatość</label><input type="number" id="roughness" min="0" max="1" step="0.05" value="0.35"><p><small>0 — gładka powierzchnia<br>1 — matowa powierzchnia</small></p><details><summary>Dane techniczne</summary><p><small>Identyfikator materiału i mapowanie źródła znajdą się tutaj. Nie trzeba ich znać, aby edytować auto.</small></p></details></section></div><div class="footer"><span id="dirty-status" class="muted">${state.dirty?'● Projekt zawiera zmiany':'Brak niezapisanych zmian'}</span><div class="row"><button data-action="restore">Przywróć oryginał</button><button class="primary" data-action="save-project">Zapisz projekt</button></div></div>`}
function save(){const t=state.time;return title('Edytor zapisu / przykładowy plik','Zespół RAGE','Precyzyjne wartości bez suwaków i wpisywania separatorów.')+`<div class="grid"><section class="card"><h2>Postęp i rekordy</h2><div class="fieldrow"><div><h3>Kredyty</h3><small>Wpisz kwotę lub zmieniaj co 1 000.</small></div><div class="stepper"><button data-action="minus" aria-label="Odejmij 1000 kredytów">−</button><input id="credits" aria-label="Kredyty" type="number" min="0" max="999999999" step="1000" value="${state.credits}"><button data-action="plus" aria-label="Dodaj 1000 kredytów">+</button></div></div><div class="fieldrow"><div><h3>Najlepsze okrążenie</h3><small>Mythical Coast · Tab przechodzi do kolejnego segmentu.</small></div><div><label class="row"><input type="checkbox" id="no-record"> Brak rekordu</label><div class="time" style="margin-top:12px"><label><small>min</small><input id="minutes" type="number" aria-label="Minuty" min="0" max="35791" value="${Math.floor(t/60000)}"></label><strong>:</strong><label><small>sek</small><input id="seconds" type="number" aria-label="Sekundy" min="0" max="59" value="${Math.floor(t/1000)%60}"></label><strong>.</strong><label><small>ms</small><input id="millis" type="number" aria-label="Milisekundy" min="0" max="999" value="${t%1000}"></label></div><div id="time-error" class="time-error" role="alert"></div></div></div><div class="fieldrow"><div><h3>Skrzynia biegów</h3><small>Esperanza</small></div><select id="gearbox" aria-label="Skrzynia biegów"><option>Automatyczna</option><option>Manualna</option></select></div><div class="footer"><span id="save-status" class="muted">Oryginał pozostaje bez zmian.</span><button class="primary" id="save-copy" data-action="save-copy">Zapisz kopię</button></div></section><section class="card"><h2>Jak to sprawdzić</h2><p>Wpisz <b>60</b> w sekundach: pojawi się błąd, bez cichej zmiany liczby.</p><p>Wpisz <b>40</b>, zaznacz „Brak rekordu”, potem wróć do czasu.</p><p>Użyj <b>Escape</b>, aby cofnąć edycję aktywnego pola.</p><small>Zakresy to przykłady UX. Docelowe ograniczenia i brak rekordu wynikają z formatu zapisu.</small></section></div>`}
function pack(){return title('Warsztat / publikacja','Zbuduj paczkę moda','Sprawdź dokładną zawartość przed eksportem.')+`<div class="grid"><section class="card"><h2>Rounded cars <small>0.1</small></h2><div class="detail row between"><span>Zmodyfikowane modele aut</span><span>3 pliki demo</span></div><div class="detail row between"><span>Ustawienia materiałów</span><span>5 zmian</span></div><div class="detail row between"><span>Manifest i opis</span><span>2 pliki demo</span></div><div class="banner warn"><b>Sprawdź pochodzenie zawartości</b><p style="margin:6px 0">Modele bazujące na oryginalnych autach wymagają osobnej oceny praw do dystrybucji. Inna strona hostingowa nie zmienia tych praw.</p></div><p class="muted">Obraz płyty, pełny wypakowany RAGE.BIN i cache oryginalnych tekstur nie należą do tej paczki.</p><button class="primary" data-action="build">Zbuduj paczkę demo</button></section><section class="card"><h2>Po eksporcie</h2><p>Zainstaluj paczkę na czystym profilu i sprawdź wynik w grze.</p><p class="muted">Eksport jest lokalny. Publikacja nie następuje automatycznie.</p></section></div>`}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.page));$('#main').innerHTML=({mods,setup,editor,save,package:pack}[state.page])();}
function mark(){state.dirty=true;const s=$('#dirty-status');if(s)s.textContent='● Projekt zawiera zmiany';const s2=$('#save-status');if(s2)s2.textContent='● Niezapisane zmiany';}
function validateTime(){const parts=['minutes','seconds','millis'].map(id=>$('#'+id));const off=$('#no-record').checked;parts.forEach(p=>p.disabled=off);let valid=off||parts.every(p=>p.value!==''&&p.validity.valid&&Number.isInteger(Number(p.value)));if(!off&&valid)valid=Number(parts[0].value)*60000+Number(parts[1].value)*1000+Number(parts[2].value)<=2147483647;$('#time-error').textContent=valid?'':'Podaj poprawny czas: sekundy 0–59, ms 0–999, bez przekroczenia zakresu.';parts.forEach(p=>p.setAttribute('aria-invalid',String(!valid)));const credits=$('#credits');$('#save-copy').disabled=!valid||!credits.validity.valid||credits.value==='';return valid}
document.addEventListener('focusin',e=>{if(e.target.matches('input[type=number]'))e.target.dataset.before=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&e.target.matches('input[type=number]')){e.target.value=e.target.dataset.before??e.target.value;if(state.page==='save')validateTime();e.stopPropagation()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){document.querySelectorAll('[data-asset]').forEach(b=>b.hidden=!b.dataset.asset.toLowerCase().includes(e.target.value.toLowerCase()));return}if(state.page==='save'){mark();validateTime()}if(e.target.id==='roughness')mark()});
document.addEventListener('change',e=>{if(e.target.id==='enabled'){state.enabled=e.target.checked;render()}if(e.target.id==='material'){state.material=e.target.value;render()}if(e.target.id==='no-record'){mark();validateTime()}if(e.target.id==='gearbox')mark();if(e.target.id==='scenario'){clearInterval(timer);state.dirty=false;state.failed=false;state.progress=0;state.conflict=e.target.value==='conflict';state.installed=e.target.value!=='empty';state.page=e.target.value==='error'?'setup':'mods';state.failed=e.target.value==='error';render()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav){go(b.dataset.nav);return}if(b.dataset.asset){if(state.dirty){toast('Najpierw zapisz projekt lub przywróć oryginał.');return}state.asset=b.dataset.asset;render();return}if(b.dataset.color){state.color=b.dataset.color;mark();render();return}const a=b.dataset.action;if(a==='close')$('#dialog').close();if(a==='discard'||a==='save-leave'){state.dirty=false;$('#dialog').close();state.page=b.dataset.page;render();if(a==='save-leave')toast('Zapisano w sesji demonstracyjnej.')}if(a==='install')modal('Zainstaluj Rounded cars','<p>Przykładowa paczka · v0.1</p><p>Zmienia modele samochodów i ich materiały. To podgląd potwierdzenia po wybraniu pliku.</p>','<button data-action="close">Anuluj</button><button class="primary" data-action="confirm-install">Zainstaluj i włącz</button>');if(a==='confirm-install'){state.installed=true;state.enabled=true;$('#dialog').close();render();toast('Mod demo zainstalowany i włączony.')}if(a==='conflict')modal('Który lakier ma być widoczny?','<p>Oba mody zmieniają materiał nadwozia Esperanzy. Pozostałe zmiany pozostaną aktywne.</p><label class="row"><input type="radio" name="winner" checked> Rounded cars</label><label class="row"><input type="radio" name="winner"> Lakier wyścigowy</label>','<button data-action="close">Wróć</button><button class="primary" data-action="resolve">Zastosuj wybór</button>');if(a==='resolve'){state.conflict=false;$('#dialog').close();render();toast('Zapisano pierwszeństwo materiału w profilu demo.')}if(a==='details')modal('Rounded cars','<p>Zmiany: zaokrąglone koła, wnętrza nadkoli, materiały szkła i nadwozia.</p><p class="muted">Autor: projekt lokalny · wersja 0.1 · dane demonstracyjne</p>','<button data-action="close">Zamknij</button><button data-action="remove">Odinstaluj</button>');if(a==='remove'){state.installed=false;state.enabled=false;$('#dialog').close();render();toast('Usunięto mod z biblioteki demo.')}if(a==='source'){state.failed=false;state.progress=5;state.ready=false;clearInterval(timer);render();timer=setInterval(()=>{state.progress=Math.min(100,state.progress+19);if(state.progress===100){clearInterval(timer);state.ready=true}if(state.page==='setup')render()},650)}if(a==='cancel-import'){clearInterval(timer);state.progress=0;render();toast('Anulowano przygotowanie. Możesz wybrać obraz ponownie.')}if(a==='library')go('mods');if(a==='play'){if(!state.ready)go('setup');else toast('Demo: przygotowanie aktywnych modów → uruchomienie gry w nowoczesnym rendererze.')}if(a==='compare'){state.compare=!state.compare;render()}if(a==='export')toast('Demo: eksport modelu OBJ, materiałów MTL i powiązanych tekstur.');if(a==='import')modal('Podgląd importu','<p>esperanza.obj · przykładowy wynik</p><p>✓ Model i koła rozpoznane<br>✓ Materiały szyb i lakieru rozdzielone<br>✓ Powiązania tekstur kompletne</p><p class="muted">Po zastosowaniu sprawdź logo na masce i napis na szybie w grze.</p>','<button data-action="close">Anuluj</button><button class="primary" data-action="apply-import">Zastosuj do projektu</button>');if(a==='apply-import'){mark();$('#dialog').close();render()}if(a==='test')toast('Demo: zapis wersji testowej → przygotowanie assetów → start gry z wybranym autem.');if(a==='restore'){state.color='#b6e475';state.dirty=false;render();toast('Przywrócono wartości początkowe makiety.')}if(a==='save-project'){state.dirty=false;render();toast('Zapisano projekt w sesji demo. Żaden plik nie został zapisany.')}if(a==='minus'||a==='plus'){const c=$('#credits');c.value=Math.max(0,Math.min(999999999,Number(c.value)+(a==='plus'?1000:-1000)));mark();validateTime()}if(a==='save-copy'&&validateTime()){state.credits=Number($('#credits').value);if(!$('#no-record').checked)state.time=Number($('#minutes').value)*60000+Number($('#seconds').value)*1000+Number($('#millis').value);state.dirty=false;$('#save-status').textContent='Zapisano kopię demonstracyjną.';toast('Demo: zapis kopii z przeliczonymi sumami kontrolnymi.')}if(a==='build')toast('Demo: walidacja zawartości → lokalny eksport paczki. Brak automatycznej publikacji.');});
render();
</script>
</html>
